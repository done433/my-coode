# --- מצב עבודה כללי ---
TLP_ENABLE=1
TLP_DEFAULT_MODE=BAT
TLP_PERSISTENT_DEFAULT=1

# --- הגדרות מעבד (CPU) - חיסכון מקסימלי ---
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=power
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# הגבלת המעבד ל-25% ביצועים בלבד על סוללה
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=40
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=25

# ביטול מצב טורבו (Boost) לחלוטין על סוללה
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# --- כרטיס מסך (Intel GPU) - נעול על המינימום בלי שגיאות ---

# --- דיסקים קשיחים ו-SSD NVMe ---
DISK_IDLE_SECS_ON_AC=2
DISK_IDLE_SECS_ON_BAT=1
DISK_APM_LEVEL_ON_AC="128 128"
DISK_APM_LEVEL_ON_BAT="1 1"
SATA_LINKPWR_ON_AC=min_power
SATA_LINKPWR_ON_BAT=min_power

# חיסכון באנרגיה לכל חיבורי לוח האם (PCIe)
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersave

# --- תקשורת ורשת ---
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=3
DEVICES_TO_DISABLE_ON_STARTUP="bluetooth"

# --- אודיו ו-USB ---
MAX_LOST_WORK_SECS_ON_BAT=15
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=0
