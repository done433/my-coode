# פיצול אנכי (ימין/שמאל)
bind -n C-n split-window -v

# פיצול אופקי (למעלה/למטה)
bind -n C-m split-window -h

# מעבר בין פאנלים
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

# הגדלה/הקטנה של הפאנל
bind -n C-z resize-pane -Z

# עכבר
set -g mouse on

set -g history-limit 20000

#set -g set-clipboard on
set -g set-clipboard external

# העתקה אוטומטית בסימון עכבר
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
