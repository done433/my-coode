# ===================================
# 🖥 נראות / התנהגות החלון
# ===================================

# שקיפות רקע:
background_opacity 0.7
dynamic_background_opacity no

# פעמון שקט בלי ביפ:
enable_audio_bell    no
visual_bell_duration 0.1
visual_bell_color    none
#window_alert_on_bell yes
window_alert_on_bell  no 
bell_on_tab "🔔 "

# סמן (cursor):
cursor_shape          block
cursor_blink_interval 0

# שובל סמן (trail) – ההגדרה המקורית שלך הייתה לא תקינה (צריך 2 ערכים).
# זה מה שהיה (שגוי, נשאר כקומנט כדי שתזכור):
# cursor_trail_decay 0.4
# דוגמה חוקית (אם תרצה להפעיל אפקט שובל, תסיר # מאחת השורות):
# cursor_trail_decay 0.1 0.4
# cursor_trail_decay 0.2 0.6

# פס גלילה וסקולרבק:
scrollbar                 scrolled
scrollbar_width           0.5
scrollbar_handle_opacity  0.5
scrollback_lines          20000
scrollback_pager          less

# פתיחת חלון תמיד באותו מקום (פחות כאוס):
#remember_window_position yes
#placement_strategy       top-left

# טקסט קריא תמיד:
inactive_text_alpha 1.0

# פונטים:
font_family FiraCode Nerd Font
bold_font   auto
italic_font auto
#font_size   12.0
#font_size   15.0

# ===================================
# ⚙️ ביצועים (חלק ומהיר, בלי פצצות GPU מוזרות)
# ===================================

#use_gpu yes

# אסטרטגיית ציור בזמן שינוי גודל:
resize_draw_strategy simple

transparent_background_colors red@0.5 #00ff00@0.3
# דיליי ברינדור (מילישניות):
repaint_delay 10
input_delay   5

# סינכרון למסך:
sync_to_monitor no
vsync          no

# מינימום זמן בין ציורים (מילישניות):
draw_min_delay 20

# מגבלת FPS:
draw_fps 30

# אין שליטה חיצונית בטרמינל הזה (אבטחה):
allow_remote_control no


# ===================================
# 🌐 URL / קישורים
# ===================================

# מצב פעיל: לזהות לינקים, להדגיש אותם, אבל לא לפתוח אוטומטית.
detect_urls       yes
open_url_with     none
allow_hyperlinks  no

# עיצוב ההדגשה של URL:
url_style underline
url_color #ffaf5f

# אלטרנטיבה (כבויה): לכבות לגמרי זיהוי URL (פחות רעש).
# אם תרצה שלא יזהה לינקים בכלל – תחליף ל:
# detect_urls no



##

font_family DejaVu Sans Mono



#scrollbar_jump_on_click yes


cursor_blink_interval -1


listen_on none


term xterm-kitty


background_tint_gaps 1.0

background #1A0F08


hide_window_decorations yes
initial_window_size 90c 14c


hide_window_decorations titlebar-only


wayland_titlebar_color background




wheel_scroll_multiplier 10.0

touch_scroll_multiplier 5.0


visual_bell_duration 0





remember_window_size no
remember_window_position no
startup_session none
placement_strategy center
#initial_window_width 126c
#initial_window_height 22c
initial_window_width 128c
initial_window_height 24c



###################################################################




#אם מושבתים, סרגל הגלילה לא יהיה נשלט באמצעות העכבר וכל אירועי העכבר יעבור דרך שורת המגילה.
scrollbar_interactive  yes




#בעת הפעלת לחיצה על מסלול שורת הגלילה יגרום למיקום הגלילה לקפוץ למיקום הקליק,
scrollbar_jump_on_click yes


#רוחב סרגל הגלילה כאשר העכבר מרחף מעליו, ביחידות של רוחב התא.
scrollbar_hover_width 1


#האטימות של ידית סרגל הגלילה, 0 להיות שקוף לחלוטין ו 1 להיות אטום מלא.
scrollbar_handle_opacity 0.5




#הגובה המינימלי של ידית שורת הגלילה ביחידות של גובה התא. מונע את הידית מלהיות קטן מדי כאשר יש הרבה גלילה
scrollbar_min_handle_height 1




#האזור הנוסף סביב הידית כדי לאפשר תפיסה קלה יותר של הברגולת ביחידות של רוחב התא.
scrollbar_hitbox_expansion 0.25



#האטימות של מסלול סרגל הגלילה, 0 להיות שקוף לחלוטין ו 1 להיות אטום מלא.
scrollbar_track_opacity 0


#הצבע של מסלול שורת הגלילה.
scrollbar_track_color red


#הצבע של ידית סרגל הגלילה.
scrollbar_handle_color yellow


#האטימות של מסלול סרגל כאשר העכבר הוא מעל סרגל הגלילה, 0 להיות שקוף לחלוטין ו 1 להיות אטום מלא
scrollbar_track_hover_opacity 0.1





#מכפיל את מספר השורות הגלול על ידי משטח מגע.
touch_scroll_multiplier 5.0






#שלט כיצד היפר-קישורים מודגשים. הם יכולים להיות מודגשים על עכבר hover, always(כלומר, באופן קבוע מודגש)
underline_hyperlinks always
mouse_map left click ungrabbed no_op


#כאשר התוכן של הלוח כבר לא משקף את הבחירה הנוכחית, לנקות אותו.
clear_selection_on_clipboard_loss yes


#תווים נחשבים לחלק ממילה בעת לחיצה כפולה.
select_by_word_characters @-./_~?&=%+#


#הגדר את החלון הפעיל לחלון מתחת לעכבר בעת הזזת העכבר
focus_follows_mouse no


#הדבקה מהבחירה הראשית
mouse_map middle release ungrabbed paste_from_selection


#סגנון בר הכרטיסייה, יכול להיות אחד של:
#tab_bar_style hidden


#המפריד בין הכרטיסיות בסרגל הכרטיסיות בעת שימוש
tab_separator " ┇"



#הגדר לערך חיובי כדי לאפשר טשטוש רקע (טשטוש של החזותי מאחורי חלון שקוף) 
background_blur 30



#מקום נפרד של עד 7 צבעים, עם אטימות. כאשר צבע הרקע של תא תואם לאחד הצבעים הללו, הוא הופך לשקוף למחצה באמצעות האטימות שצוינה.
transparent_background_colors red@0.5 #00ff00@0.3




#כמה לצבוע את תמונת הרקע לפי צבע הרקע. אפשרות זו זה עושה את זה קל יותר לקרוא את הטקסט
#background_tint 0.0




#סגור את החלון כאשר התהליך (בדרך כלל הקליפה) יוצא. עם ערך ברירת המחדל no
close_on_child_death yes



#אפילו עובד על קשרי SSH. הגדרת ברירת המחדל של noמונע כל צורה של שלט רחוק.
allow_remote_control no










font_size   14.0





#map ctrl+shift+left  focus_window left
#map ctrl+shift+right focus_window right
#map ctrl+shift+up    focus_window up
#map ctrl+shift+down  focus_window down


font_family MesloLGS NF




color_multipliplier 1.5


scroll_lines 1

enable_smooth_scrolling yes

scroll_pixel_lines yes


background_blur 80








######################
#מוחק מילה קדימה (מהסמן ימינה)
#map alt+d send_text all \ed
#map alt+d send_text all \x1bd
#map alt+d kitten send-text \x1bd


inactive_window_opacity 0.7
confirm_os_window_close 0

map kitty +kitten ssh ssh
